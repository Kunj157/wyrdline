[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Each entry needs a reason and is removed when its cause goes away.
ignore = [
  # Unmaintained, not a vulnerability. Reached only through testcontainers
  # 0.28.0, a dev-dependency of wyrd-hub for its container tests; no shipped
  # binary contains it. No release of testcontainers drops it yet.
  { id = "RUSTSEC-2026-0440", reason = "unmaintained; dev-only via testcontainers (wyrd-hub tests)" },
]

[licenses]
version = 2
confidence-threshold = 0.9
unused-allowed-license = "allow"
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CC0-1.0",
  "MPL-2.0",
  "BSL-1.0",
  "CDLA-Permissive-2.0",
]
[[licenses.exceptions]]
allow = ["GPL-2.0"]
crate = "wyrd-ebpf"

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
