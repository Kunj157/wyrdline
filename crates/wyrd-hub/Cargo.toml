[package]
name = "wyrd-hub"
description = "Wyrdline Hub: the self-hosted team server for shared bundles, dashboards, and search"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
base64 = "0.22.1"
axum = { workspace = true, features = ["form", "matched-path"] }
hex.workspace = true
ring = "0.17.14"
serde.workspace = true
serde_json.workspace = true
sqlx-core = { version = "0.9.0", features = ["_rt-tokio", "_tls-rustls-ring-webpki", "migrate", "json"] }
sqlx-postgres = { version = "0.9.0", features = ["migrate", "json"] }
thiserror.workspace = true
tokio.workspace = true
tower.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
ulid.workspace = true
ureq.workspace = true

[dev-dependencies]
http-body-util.workspace = true
tempfile.workspace = true
testcontainers = "0.28.0"

[features]
# Integration tests that start Postgres and MinIO with Testcontainers
# (needs Docker; run by `make test-hub`).
container-tests = []

[lints]
workspace = true
