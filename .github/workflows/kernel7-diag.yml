name: kernel7-diag

# Temporary diagnostic for the sensor on newer runner kernels. Not for merge.
on:
  push:
    branches: [infra/sensor-kernel-diagnostics]

permissions:
  contents: read

jobs:
  build:
    name: build old and new
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install toolchains
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup toolchain install nightly --profile minimal --component rust-src
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: bpf-linker
      - name: Build new
        run: |
          cargo build --locked -p wyrd-sensor --example kernel_diag --example matrix_check
          mkdir -p out/new out/old
          cp target/debug/examples/kernel_diag target/debug/examples/matrix_check out/new/
      - name: Build old (origin/dev)
        run: |
          git worktree add ../old origin/dev
          (cd ../old && CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target-old" cargo build --locked -p wyrd-sensor --example matrix_check)
          cp target-old/debug/examples/matrix_check out/old/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bins
          path: out
          retention-days: 2

  runner:
    name: runner ${{ matrix.os }} ${{ matrix.n }}
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, ubuntu-24.04]
        n: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bins
          path: bins
      - name: Kernel facts
        run: |
          uname -a
          grep -E 'CONFIG_TRACE_SYSCALL|CONFIG_PREEMPT=|CONFIG_PREEMPT_LAZY' "/boot/config-$(uname -r)" || true
      - name: old matrix_check
        run: |
          chmod +x bins/*/*
          sudo env TMPDIR=/dev/shm bins/old/matrix_check 2>&1 | grep -v '^[0-9]*: \|^;' || true
          sudo dmesg | tail -40
      - name: new matrix_check
        run: |
          sudo env TMPDIR=/dev/shm bins/new/matrix_check 2>&1 | grep -v '^[0-9]*: \|^;'
      - name: new kernel_diag
        run: sudo env TMPDIR=/dev/shm bins/new/kernel_diag
      - name: Install toolchains
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup toolchain install nightly --profile minimal --component rust-src
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-nextest,bpf-linker
      - name: Start a systemd user manager (session cgroups)
        run: |
          sudo loginctl enable-linger "$USER"
          uid=$(id -u)
          for _ in $(seq 1 50); do [ -S "/run/user/$uid/systemd/private" ] && break; sleep 0.2; done
          echo "XDG_RUNTIME_DIR=/run/user/$uid" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$uid/bus" >> "$GITHUB_ENV"
      - name: Privileged integration (no fail-fast)
        run: |
          WYRD_PRIVILEGED_HELPER=sudo cargo nextest run --locked --no-fail-fast -p wyrd-cli -p wyrd-fakeagent -p wyrd-sensord -p wyrdd \
            --features wyrd-cli/privileged-tests,wyrd-fakeagent/privileged-tests,wyrd-sensord/privileged-tests,wyrdd/privileged-tests \
            -E 'test(/^privileged_/)'

  vm:
    name: vm ${{ matrix.kernel }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        kernel: ["6.18", "6.19", "7.0", "7.1", "7.2"]
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bins
          path: bins
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install QEMU and vmtest
        env:
          VMTEST_VERSION: v0.18.0
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-guest-agent > /dev/null
          curl -sSL -o vmtest "https://github.com/danobi/vmtest/releases/download/${VMTEST_VERSION}/vmtest-x86_64"
          chmod +x vmtest
      - name: Fetch kernel
        run: |
          docker pull -q "ghcr.io/cilium/ci-kernels:${{ matrix.kernel }}"
          id=$(docker create "ghcr.io/cilium/ci-kernels:${{ matrix.kernel }}" /none)
          docker cp "$id:/boot/vmlinuz" vmlinuz
          docker rm "$id" > /dev/null
      - name: old in VM
        run: |
          chmod +x bins/*/*
          ./vmtest --kernel vmlinuz -- "env TMPDIR=/dev/shm $PWD/bins/old/matrix_check" 2>&1 | grep -v '^[0-9]*: \|^;' | tail -8 || true
      - name: new in VM
        run: |
          ./vmtest --kernel vmlinuz -- "env TMPDIR=/dev/shm $PWD/bins/new/matrix_check" 2>&1 | grep -v '^[0-9]*: \|^;' | tail -8
      - name: new diag in VM
        run: ./vmtest --kernel vmlinuz -- "env TMPDIR=/dev/shm $PWD/bins/new/kernel_diag" 2>&1 | tail -80
