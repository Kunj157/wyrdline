[package]
name = "wyrd-cli"
description = "The wyrd command-line interface"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[[bin]]
name = "wyrd"
path = "src/main.rs"

# The escape suite (needs sudo, the sensor, and a C compiler).
[[test]]
name = "escape"
path = "../../tests/security/escape/main.rs"
required-features = ["privileged-tests"]

[dependencies]
anyhow.workspace = true
clap.workspace = true
hex.workspace = true
landlock.workspace = true
rustix.workspace = true
serde_json.workspace = true
serde.workspace = true
tracing.workspace = true
wyrd-adapters = { path = "../wyrd-adapters" }
wyrd-cell = { path = "../wyrd-cell" }
wyrd-correlator = { path = "../wyrd-correlator" }
wyrd-doctor = { path = "../wyrd-doctor" }
wyrd-gateway = { path = "../wyrd-gateway" }
wyrd-ledger = { path = "../wyrd-ledger" }
wyrd-policy = { path = "../wyrd-policy" }
wyrd-schema = { path = "../wyrd-schema" }
wyrd-sensor = { path = "../wyrd-sensor" }

[dev-dependencies]
insta.workspace = true
rustix.workspace = true
serde_json.workspace = true
tempfile.workspace = true
wyrd-correlator = { path = "../wyrd-correlator", features = ["synth"] }
wyrd-ledger = { path = "../wyrd-ledger" }
wyrd-schema = { path = "../wyrd-schema" }

[features]
# Tests that need passwordless sudo and the kernel features Cells use.
privileged-tests = []

[lints]
workspace = true
