name: pull-request

# The gate on every PR and push to dev/main; release.yml calls it on tags.
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-gate
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: "-D warnings"

jobs:
  rust:
    name: Rust · fmt, clippy, tests, build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install nightly for the eBPF object
        run: rustup toolchain install nightly --profile minimal --component rust-src
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-nextest,bpf-linker,cargo-binstall
      - name: Format
        run: make fmt-check-rust
      - name: Clippy
        run: make lint-rust
      - name: Tests
        run: make test-rust
      - name: Policies build and pass their conformance cases
        run: make test-policies
      - name: Divergence and claim evals meet the baseline
        run: make test-evals
      - name: Generated schemas are current
        run: make schemas-check
      - name: Native and WebAssembly correlator agree
        run: |
          cargo binstall --no-confirm --locked wasm-bindgen-cli@0.2.129 > /dev/null 2>&1 || cargo install --locked wasm-bindgen-cli@0.2.129
          make wasm-parity
      - name: Release build
        run: make build-rust

  cell:
    name: Cell · privileged integration
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install nightly for the eBPF object
        run: rustup toolchain install nightly --profile minimal --component rust-src
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-nextest,bpf-linker
      - name: Start a systemd user manager (session cgroups)
        run: |
          sudo loginctl enable-linger "$USER"
          uid=$(id -u)
          for _ in $(seq 1 50); do [ -S "/run/user/$uid/systemd/private" ] && break; sleep 0.2; done
          echo "XDG_RUNTIME_DIR=/run/user/$uid" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$uid/bus" >> "$GITHUB_ENV"
      - name: Kernel capabilities
        run: cargo run --quiet --locked -p wyrd-cli -- doctor || true
      - name: Privileged Cell tests
        run: make test-integration

  hub:
    name: Hub · Postgres and MinIO integration
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-nextest
      - name: Hub lint and tests (DuckDB analytics, Testcontainers)
        run: make test-hub

  studio:
    name: Studio · format, lint, types, tests, build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Type check
        run: pnpm typecheck
      - name: Tests
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Dependency audit (runtime)
        run: pnpm audit --prod --audit-level high

  e2e:
    name: Studio · end to end
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # Postgres for the Hub-backed Studio test (make test-e2e-hub); MinIO is
    # started by a step, like the Hub's Testcontainers pin.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: hub
          POSTGRES_PASSWORD: wyrd-e2e-${{ github.run_id }}
          POSTGRES_DB: wyrd_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hub -d wyrd_e2e"
          --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Install nightly for the eBPF object (wyrd builds the sensor client)
        run: rustup toolchain install nightly --profile minimal --component rust-src
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: bpf-linker,cargo-binstall
      - name: Install wasm-bindgen (offline-mode correlator)
        run: cargo binstall --no-confirm --locked wasm-bindgen-cli@0.2.129 > /dev/null 2>&1 || cargo install --locked wasm-bindgen-cli@0.2.129
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium for Playwright
        run: pnpm exec playwright install --with-deps chromium
      - name: Studio against a real daemon (headless Chromium)
        run: make test-e2e
      - name: Hub and Studio end to end (Hub, MinIO, two teammates and a viewer)
        env:
          WYRD_E2E_HUB_BIN: ${{ github.workspace }}/target/debug/wyrd-hub
          WYRD_E2E_HUB_DATABASE_URL: postgres://hub:wyrd-e2e-${{ github.run_id }}@127.0.0.1:5432/wyrd_e2e
          WYRD_E2E_HUB_S3_ENDPOINT: http://127.0.0.1:9000
          WYRD_E2E_HUB_S3_KEY: wyrd-minio-${{ github.run_id }}
          WYRD_E2E_HUB_S3_SECRET: wyrd-minio-secret-${{ github.run_id }}
        run: |
          set -euo pipefail
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER="$WYRD_E2E_HUB_S3_KEY" \
            -e MINIO_ROOT_PASSWORD="$WYRD_E2E_HUB_S3_SECRET" \
            pgsty/minio:RELEASE.2026-08-04T00-00-00Z server /data
          for _ in $(seq 1 60); do
            curl -fsS http://127.0.0.1:9000/minio/health/ready && break
            sleep 2
          done
          command -v psql >/dev/null || { sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client; }
          cargo build --locked -p wyrd-hub --bin wyrd-hub
          make test-e2e-hub
      - name: WebGPU river (SwiftShader, virtual display)
        run: make test-e2e-webgpu
      - name: Landing page as published (site, Studio, demo session)
        run: make test-site
      - name: Keep screenshots and performance numbers
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results
          path: |
            target/e2e-results
            target/e2e-results-hub
            target/site-results
          retention-days: 7

  fuzz:
    name: Fuzz · 60 s per parser
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install nightly
        run: rustup toolchain install nightly --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: fuzz
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-fuzz
      - name: Fuzz smoke
        run: make fuzz FUZZ_SECONDS=60
      - name: Keep crashing inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
          retention-days: 14

  supply-chain:
    name: Supply chain · cargo-deny
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: --all-features

  security:
    name: Security · secrets, SAST
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks detect --no-banner --redact
      - name: Semgrep
        run: pipx run semgrep scan --config p/default --error --metrics off --exclude target --exclude node_modules .
      - name: Semgrep · Wyrdline rules (no unwrap on input paths, no shell-out in wyrdd)
        run: pipx run semgrep scan --config .semgrep/wyrd.yml --error --metrics off --exclude target --exclude node_modules .

  release-scripts:
    name: Release · packaging scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Packaging, reproducibility compare, version stamp
        run: bash tests/release/scripts.test.sh
      - name: shellcheck
        run: shellcheck scripts/release/*.sh tests/release/*.sh

  workflows:
    name: Workflows · actionlint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: |
          curl -sSL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            | tar -xz actionlint
          ./actionlint -color
