[package]
name = "wyrd-hub"
description = "Wyrdline Hub: the self-hosted team server for shared bundles, dashboards, and search"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
futures-util.workspace = true
base64 = "0.22.1"
duckdb = { version = "1.10506.1", features = ["bundled", "parquet"], optional = true }
axum = { workspace = true, features = ["form", "matched-path", "multipart", "ws"] }
hex.workspace = true
ring = "0.17.14"
serde.workspace = true
serde_json.workspace = true
sqlx-core = { version = "0.9.0", features = ["_rt-tokio", "_tls-rustls-ring-webpki", "migrate", "json"] }
sqlx-postgres = { version = "0.9.0", features = ["migrate", "json"] }
thiserror.workspace = true
tokio.workspace = true
tower.workspace = true
tower-http = { workspace = true, features = ["fs"] }
tracing.workspace = true
tracing-subscriber.workspace = true
ulid.workspace = true
ureq.workspace = true
wyrd-bundle = { path = "../wyrd-bundle" }
wyrd-schema = { path = "../wyrd-schema" }
wyrd-sync = { path = "../wyrd-sync" }

[dev-dependencies]
automerge.workspace = true
ed25519-dalek.workspace = true
ruzstd.workspace = true
tar.workspace = true
wyrd-divergence = { path = "../wyrd-divergence" }
http-body-util.workspace = true
tempfile.workspace = true
testcontainers = "0.28.0"
tokio-tungstenite = "0.29.0"

[features]
# Analytics over Parquet projections with embedded DuckDB (compiles DuckDB
# from source; on in `make test-hub` and the hub CI job).
analytics = ["dep:duckdb"]
# Integration tests that start Postgres and MinIO with Testcontainers
# (needs Docker; run by `make test-hub`).
container-tests = []

[lints]
workspace = true
