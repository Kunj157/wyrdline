[package]
name = "wyrdd"
description = "Per-user Wyrdline daemon: the HTTP API over the session data directory"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
axum.workspace = true
clap.workspace = true
futures-util.workspace = true
getrandom.workspace = true
hex.workspace = true
rustix.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tower.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
ts-rs.workspace = true
ulid.workspace = true
wyrd-adapters = { path = "../wyrd-adapters" }
wyrd-policy = { path = "../wyrd-policy" }
wyrd-cell = { path = "../wyrd-cell" }
wyrd-correlator = { path = "../wyrd-correlator" }
wyrd-doctor = { path = "../wyrd-doctor" }
wyrd-ledger = { path = "../wyrd-ledger" }
wyrd-schema = { path = "../wyrd-schema" }

[dev-dependencies]
http-body-util.workspace = true
wyrd-correlator = { path = "../wyrd-correlator", features = ["synth"] }
tempfile.workspace = true

[features]
# Tests that need passwordless sudo (a second user on the socket).
privileged-tests = []

[lints]
workspace = true

[[bin]]
name = "wyrdd"
path = "src/main.rs"

[[bin]]
name = "wyrdd-gen-api"
path = "src/bin/gen_api.rs"
