name = "reads AWS credentials, then connects to a mentioned host within the window"
expect = ["D003"]
task = "upload the report to https://reports.example.com"
[[step]]
read = "~/.aws/credentials"
[[step]]
wait_ms = 3000
[[step]]
bash = "node upload.js https://reports.example.com"
connects = [{ host = "reports.example.com" }]
