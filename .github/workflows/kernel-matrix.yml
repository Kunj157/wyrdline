name: kernel-matrix

# Loads, verifies, attaches, and exercises the eBPF programs on several
# kernels in VMs (vmtest + cilium ci-kernels images).
on:
  pull_request:
    branches: [dev, main]
    paths:
      - crates/wyrd-common/**
      - crates/wyrd-ebpf/**
      - crates/wyrd-sensor/**
      - .github/workflows/kernel-matrix.yml
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build matrix check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchains
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup toolchain install nightly --profile minimal --component rust-src
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: bpf-linker
      - name: Build
        run: cargo build --locked -p wyrd-sensor --example matrix_check
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: matrix-check
          path: target/debug/examples/matrix_check
          retention-days: 3

  kernel:
    name: Kernel ${{ matrix.kernel }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        kernel: ["5.15", "6.1", "6.6", "6.12", "7.2"]
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: matrix-check
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install QEMU and vmtest
        env:
          VMTEST_VERSION: v0.18.0
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-guest-agent > /dev/null
          curl -sSL -o vmtest "https://github.com/danobi/vmtest/releases/download/${VMTEST_VERSION}/vmtest-x86_64"
          chmod +x vmtest
      - name: Fetch kernel ${{ matrix.kernel }}
        run: |
          docker pull -q "ghcr.io/cilium/ci-kernels:${{ matrix.kernel }}"
          id=$(docker create "ghcr.io/cilium/ci-kernels:${{ matrix.kernel }}" /none)
          docker cp "$id:/boot/vmlinuz" vmlinuz
          docker rm "$id" > /dev/null
      - name: Run the check inside the VM
        run: |
          chmod +x matrix_check
          ./vmtest --kernel vmlinuz -- "env TMPDIR=/dev/shm $PWD/matrix_check"

  perf:
    name: Sensor throughput and overhead (strict)
    # Measurements need a quiet machine: nightly and on demand only.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchains
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup toolchain install nightly --profile minimal --component rust-src
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-nextest,bpf-linker
      - name: Start a systemd user manager (session cgroups)
        run: |
          sudo loginctl enable-linger "$USER"
          uid=$(id -u)
          for _ in $(seq 1 50); do [ -S "/run/user/$uid/systemd/private" ] && break; sleep 0.2; done
          echo "XDG_RUNTIME_DIR=/run/user/$uid" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$uid/bus" >> "$GITHUB_ENV"
      - name: Measure
        env:
          WYRD_PERF_STRICT: "1"
        run: make test-perf
