[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/Kunj157/wyrdline"
authors = ["Kunj157 <kunjr157@gmail.com>"]
publish = false

[workspace.dependencies]
anyhow = "1.0.104"
blake3 = "1.8.7"
ciborium = "0.2.2"
ed25519-dalek = "3.0.0"
fastcdc = "5.0.0"
getrandom = "0.4.3"
hex = "0.4.3"
landlock = "0.4.7"
nix = { version = "0.31.3", features = ["sched", "mount", "user", "fs", "process", "signal"] }
proptest = "1.12.0"
regex = "1.13.1"
schemars = "1.2.3"
clap = { version = "4.6.7", features = ["derive"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
rustix = { version = "1.1.5", features = ["process", "fs", "time", "net"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_bytes = "0.11.19"
serde_json = "1.0.154"
tempfile = "3.27.0"
thiserror = "2.0.21"
ulid = "3.0.0"
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "sync", "time", "net", "io-util", "signal", "fs", "process"] }
tracing = "0.1.44"
zstd = "0.14.2"
ts-rs = { version = "12.0.1", features = ["serde-json-impl"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
print_stdout = "warn"
todo = "deny"

# Keep target/ small: line tables are enough for backtraces, and
# dependencies carry no debug info.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
