[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/Kunj157/wyrdline"
authors = ["Kunj157 <kunjr157@gmail.com>"]
publish = false

[workspace.dependencies]
anyhow = "1.0.104"
ciborium = "0.2.2"
proptest = "1.12.0"
schemars = "1.2.3"
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "sync", "time", "net", "io-util", "signal", "fs", "process"] }
tracing = "0.1.44"
ts-rs = { version = "12.0.1", features = ["serde-json-impl"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
print_stdout = "warn"
todo = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
