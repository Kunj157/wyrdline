[package]
name = "wyrd-fakeagent"
description = "Deterministic scripted coding agent and toy MCP server for scenario tests"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[[bin]]
name = "wyrd-fakeagent"
path = "src/main.rs"

[[test]]
name = "scenarios"
path = "../../tests/scenarios/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true
wyrd-bundle = { path = "../wyrd-bundle" }
wyrd-ledger = { path = "../wyrd-ledger" }
wyrd-schema = { path = "../wyrd-schema" }

[features]
# Scenarios that run in a real Cell (passwordless sudo, as `make test-integration`).
privileged-tests = []

[lints]
workspace = true
