name: hub-image

# The Hub container image (deploy/docker/hub.Dockerfile). Every PR that
# touches the Hub build inputs and every v* tag builds it, scans it with
# Trivy (fails on fixable HIGH/CRITICAL) and writes a CycloneDX SBOM.
# On a v* tag the image is pushed to GHCR by digest, signed with cosign
# keyless (this workflow's identity), and gets build-provenance and SBOM
# attestations.
on:
  pull_request:
    paths:
      - deploy/docker/**
      - crates/**
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/hub-image.yml
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/kunj157/wyrdline-hub
  DOCKERFILE: deploy/docker/hub.Dockerfile

jobs:
  build:
    name: Hub image · build, Trivy scan, SBOM
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the image (local, not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          load: true
          tags: wyrdline-hub:ci
          cache-from: type=gha,scope=hub-image
          cache-to: type=gha,scope=hub-image,mode=max
      - name: Trivy scan (fails on fixable HIGH or CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: wyrdline-hub:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          vuln-type: os,library
          format: table
          exit-code: "1"
      - name: CycloneDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: wyrdline-hub:ci
          scanners: vuln
          format: cyclonedx
          output: hub.cdx.json
          exit-code: "0"
      - name: Smoke test (read-only rootfs, no capabilities, /healthz answers)
        run: |
          docker run -d --name hub-smoke --network host \
            --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges \
            -e WYRD_HUB_PUBLIC_URL=http://127.0.0.1:7730 \
            -e WYRD_HUB_DATABASE_URL='postgres://hub:dev-placeholder@127.0.0.1:1/hub' \
            -e WYRD_HUB_S3_ENDPOINT=http://127.0.0.1:1/ \
            -e WYRD_HUB_S3_BUCKET=wyrd-bundles \
            -e WYRD_HUB_S3_ACCESS_KEY_ID=dev \
            -e WYRD_HUB_S3_SECRET_ACCESS_KEY=dev-placeholder \
            wyrdline-hub:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:7730/healthz > /dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:7730/healthz
          docker logs hub-smoke 2>&1 | tail -20
          docker rm -f hub-smoke > /dev/null
      - name: Image facts for the job summary
        run: |
          {
            echo "### Hub image"
            echo
            echo "- user: $(docker inspect --format '{{.Config.User}}' wyrdline-hub:ci)"
            echo "- entrypoint: $(docker inspect --format '{{json .Config.Entrypoint}}' wyrdline-hub:ci)"
            echo "- size: $(docker image inspect --format '{{.Size}}' wyrdline-hub:ci) bytes"
          } >> "$GITHUB_STEP_SUMMARY"
          test "$(docker inspect --format '{{.Config.User}}' wyrdline-hub:ci)" = "65532:65532"
          # No shell and no package manager in the final image.
          if docker run --rm --entrypoint /bin/sh wyrdline-hub:ci -c true 2>/dev/null; then
            echo "::error::the image contains a shell"; exit 1
          fi

  publish:
    name: Hub image · push by digest, gate, sign, attest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest (no tag yet)
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=hub-image
          provenance: mode=max
          sbom: false
      - name: Trivy gate on the pushed digest (fails on fixable HIGH or CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          vuln-type: os,library
          format: table
          exit-code: "1"
      - name: CycloneDX SBOM of the pushed digest
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
          scanners: vuln
          format: cyclonedx
          output: hub.cdx.json
          exit-code: "0"
      - name: Tag the scanned digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: docker buildx imagetools create --tag "${IMAGE}:${GITHUB_REF_NAME}" "${IMAGE}@${DIGEST}"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the image digest (cosign keyless)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
      - name: Verify the signature identity
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
        run: |
          cosign verify \
            --certificate-identity "https://github.com/${REPO}/.github/workflows/hub-image.yml@${REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${IMAGE}@${DIGEST}" > /dev/null
      - name: Build provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: SBOM attestation (of the same digest)
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: hub.cdx.json
          push-to-registry: true
