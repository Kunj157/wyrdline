{{- include "wyrdline-hub.validate" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "wyrdline-hub.fullname" . }}
  labels:
    {{- include "wyrdline-hub.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      {{- include "wyrdline-hub.selectorLabels" . | nindent 6 }}
  strategy:
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      annotations:
        {{- if .Values.metrics.scrapeAnnotations }}
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.hub.listenPort | quote }}
        prometheus.io/path: /metrics
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "wyrdline-hub.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "wyrdline-hub.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: hub
          image: {{ include "wyrdline-hub.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.hub.listenPort }}
              protocol: TCP
          env:
            - name: WYRD_HUB_LISTEN
              value: {{ printf "0.0.0.0:%d" (int .Values.hub.listenPort) | quote }}
            - name: WYRD_HUB_PUBLIC_URL
              value: {{ .Values.publicUrl | trimSuffix "/" | quote }}
            - name: WYRD_HUB_DB_MAX_CONNECTIONS
              value: {{ .Values.hub.dbMaxConnections | quote }}
            - name: WYRD_HUB_DATA_DIR
              value: /data
            - name: WYRD_LOG
              value: {{ .Values.hub.logFilter | quote }}
            - name: WYRD_HUB_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret }}
                  key: database-url
            - name: WYRD_HUB_S3_ENDPOINT
              value: {{ .Values.s3.endpoint | trimSuffix "/" | quote }}
            - name: WYRD_HUB_S3_BUCKET
              value: {{ .Values.s3.bucket | quote }}
            - name: WYRD_HUB_S3_REGION
              value: {{ .Values.s3.region | quote }}
            - name: WYRD_HUB_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.s3.existingSecret }}
                  key: access-key-id
            - name: WYRD_HUB_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.s3.existingSecret }}
                  key: secret-access-key
            {{- if .Values.oidc.issuer }}
            - name: WYRD_HUB_OIDC_ISSUER
              value: {{ .Values.oidc.issuer | trimSuffix "/" | quote }}
            - name: WYRD_HUB_OIDC_CLIENT_ID
              value: {{ .Values.oidc.clientId | quote }}
            - name: WYRD_HUB_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.oidc.existingSecret }}
                  key: client-secret
            {{- end }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          emptyDir:
            sizeLimit: {{ .Values.persistence.dataSizeLimit }}
        - name: tmp
          emptyDir:
            sizeLimit: {{ .Values.persistence.tmpSizeLimit }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
